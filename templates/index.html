<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المراية الذكية</title>
<style>
  body {
    background: var(--bg, #000);
    color: var(--text, #fff);
    font-family: "Segoe UI", Tahoma, sans-serif;
    margin: 0; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
    padding: 40px; box-sizing: border-box;
  }
  #brand { font-size: 26px; color: var(--accent, #d4a574); }
  #clock { font-size: 72px; font-weight: 300; }
  #date { font-size: 28px; color: #aaa; }
  #advice {
    font-size: 40px; text-align: center; max-width: 80%;
    color: var(--accent, #d4a574);
    opacity: 0; transition: opacity 1s; line-height: 1.6;
  }
</style>
</head>
<body>
  <div style="text-align:center">
    <div id="brand"></div>
    <div id="clock"></div>
    <div id="date"></div>
  </div>
  <div id="advice"></div>
<script>
  async function loadTheme() {
    const r = await fetch("/persona");
    const p = await r.json();
    document.documentElement.style.setProperty("--accent", p.theme.accent);
    document.documentElement.style.setProperty("--bg", p.theme.background);
    document.documentElement.style.setProperty("--text", p.theme.text);
    document.getElementById("brand").textContent = p.brand_name;
  }
  loadTheme();
  setInterval(loadTheme, 30000);

  let lastId = 0;
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString("ar", {hour: "2-digit", minute: "2-digit"});
    document.getElementById("date").textContent =
      now.toLocaleDateString("ar", {weekday: "long", day: "numeric", month: "long"});
  }
  setInterval(tick, 1000); tick();

  async function poll() {
    try {
      const r = await fetch("/advice");
      const d = await r.json();
      const el = document.getElementById("advice");
      if (d.id !== lastId && d.text) {
        lastId = d.id;
        el.textContent = d.text;
        el.style.opacity = 1;
        setTimeout(() => { el.style.opacity = 0; }, {{ display_ms }});
      }
    } catch (e) {}
  }
  setInterval(poll, 1000);
</script>
</body>
</html>
